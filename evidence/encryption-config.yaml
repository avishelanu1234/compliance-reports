# NovaPay encryption configuration — PCI-DSS Requirement 3.4
cardholder_data:
  storage: prohibited
  transit_encryption: TLS_1_3_minimum
  key_management: AWS_KMS
  encryption_algorithm: AES-256
  key_rotation_policy: every_12_months
  data_classification: sensitive
  access_control: strict
  multi_factor_authentication: required
  adaptive_access_controls: enabled
  microsegmentation_zones:
    - zone1: trusted
    - zone2: restricted
  logging: enabled
  data_handling: comply_with_GDPR

audit_logging:
  enabled: true
  retention_days: 365
  tamper_evident: true
  alerting: enabled
  real_time_monitoring: enabled
  automated_response: enabled
